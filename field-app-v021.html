<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#24247A">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="manifest" href="manifest.webmanifest">
<title>Atlas Field Market Data</title>
<style>html,body{margin:0;min-height:100%;background:#F4F5F8;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}.fallback{max-width:420px;margin:18vh auto;padding:24px;text-align:center;color:#172033}.fallback a{color:#24247A;font-weight:800}</style>
</head>
<body>
<div id="fallback" class="fallback">Loading Atlas Field Market Data…</div>
<script>
(async()=>{
  try{
    const r=await fetch('field-app-v018.html?v=0180',{cache:'no-store'});
    if(!r.ok)throw new Error('Base app could not be loaded.');
    let html=await r.text();
    if(!html.includes('rel="manifest"'))html=html.replace('</head>','<link rel="manifest" href="manifest.webmanifest"></head>');
    html=html.replace('</body>','<script src="entity-resolution-v021.js?v=0210"><\/script></body>');
    document.open();document.write(html);document.close();
  }catch(err){
    document.getElementById('fallback').innerHTML='<strong>Could not load latest field app.</strong><p>'+String(err.message||err)+'</p><a href="field-app-v019.html?v=0190">Open stable v0.19</a>';
  }
})();
</script>
</body>
</html>
